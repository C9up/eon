[package]
name = "eon-query-napi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "NAPI bindings for eon-query TDengine SQL compiler"

[lib]
crate-type = ["cdylib"]

[dependencies]
eon-query = { path = "../eon-query" }
napi = { version = "3", features = ["serde-json"] }
napi-derive = { version = "3", features = ["type-def"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"
